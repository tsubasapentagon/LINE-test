<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LINE連携中</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px 20px;
    }

    #status {
      font-size: 20px;
      margin-bottom: 20px;
    }

    #debug {
      white-space: pre-wrap;
      text-align: left;
      background: #f5f5f5;
      padding: 12px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 12px;
    }

    .friend-btn {
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <p id="status">LINE連携中...</p>

  <div id="friendArea"></div>

  <pre id="debug"></pre>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    const LIFF_ID =
      "2010275496-Wl17Ab7m";

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbzuhpQhlQzcjoogmT8Ce7_TIDOWV0n-w-HTDlxH_3mizJlmPnF42kDdkVbscjomIC7k/exec";

    const FRIEND_ADD_URL =
      "https://lin.ee/uXmNpaL";

    function show(msg) {
      document.getElementById("status").innerText = msg;
      document.getElementById("debug").innerText += msg + "\n";
    }

    function getSrc() {
      const params = new URLSearchParams(location.search);
      return params.get("src") || "unknown";
    }

    function showFriendButton() {
      document.getElementById("friendArea").innerHTML = `
        <div class="friend-btn">
          <a href="${FRIEND_ADD_URL}">
            <img
              src="https://scdn.line-apps.com/n/line_add_friends/btn/ja.png"
              alt="友だち追加"
              height="50"
              border="0">
          </a>

          <p>
            友だち追加後、もう一度このページを開いてください
          </p>
        </div>
      `;
    }

    async function saveToGas(src, profile) {
      await fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain"
        },
        body: JSON.stringify({
          type: "article_source",
          src: src,
          line_user_id: profile.userId,
          display_name: profile.displayName
        })
      });
    }

    async function main() {
      try {
        show("LIFF初期化中...");

        await liff.init({
          liffId: LIFF_ID
        });

        const src = getSrc();

        if (!liff.isLoggedIn()) {
          show("LINEログインへ移動します...");

          liff.login({
            redirectUri:
              location.origin +
              location.pathname +
              "?src=" +
              encodeURIComponent(src),

            botPrompt: "aggressive"
          });

          return;
        }

        show("プロフィール取得中...");

        const profile = await liff.getProfile();

        show("友だち追加状態を確認中...");

        const friendship = await liff.getFriendship();

        if (!friendship.friendFlag) {
          show("まだ友だち追加されていません");
          showFriendButton();
          return;
        }

        show("保存中...");

        await saveToGas(src, profile);

        show("保存完了！");

        document.getElementById("friendArea").innerHTML = `
          <p>LINE連携が完了しました。</p>
        `;

      } catch (err) {
        show("エラー: " + err.message);
        console.error(err);
      }
    }

    main();
  </script>

</body>
</html>
