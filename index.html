<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LINE連携中</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px 20px;
    }

    #status {
      font-size: 20px;
      margin-bottom: 20px;
    }

    #debug {
      white-space: pre-wrap;
      text-align: left;
      background: #f5f5f5;
      padding: 12px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <p id="status">LINE連携中...</p>
  <pre id="debug"></pre>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    const LIFF_ID =
      "2010275496-Wl17Ab7m";

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbzuhpQhlQzcjoogmT8Ce7_TIDOWV0n-w-HTDlxH_3mizJlmPnF42kDdkVbscjomIC7k/exec";

    const FRIEND_ADD_URL =
      "https://lin.ee/uXmNpaL";

    function show(msg) {
      document.getElementById("status").innerText = msg;
      document.getElementById("debug").innerText += msg + "\n";
    }

    function getSrc() {
  const params = new URLSearchParams(location.search);

  // 通常URLの ?src=xxx
  const directSrc = params.get("src");
  if (directSrc) return directSrc;

  // LIFF URL経由の場合の liff.state
  const liffState = params.get("liff.state");
  if (liffState) {
    const stateParams = new URLSearchParams(liffState);
    const stateSrc = stateParams.get("src");
    if (stateSrc) return stateSrc;
  }

  return "unknown";
}

    function getRedirectUrl(src) {
      return (
        location.origin +
        location.pathname +
        "?src=" +
        encodeURIComponent(src)
      );
    }

    async function saveToGas(src, profile) {
      await fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain"
        },
        body: JSON.stringify({
          type: "article_source",
          src: src,
          line_user_id: profile.userId,
          display_name: profile.displayName
        })
      });
    }

    function retryLogin() {
      const src = getSrc();

      show("認証情報をリセットして再ログインします...");

      try {
        liff.logout();
      } catch (e) {
        console.warn(e);
      }

      liff.login({
        redirectUri: getRedirectUrl(src)
      });
    }

    async function main() {
      try {
        show("LIFF初期化中...");

        await liff.init({
          liffId: LIFF_ID
        });

        const src = getSrc();

        if (!liff.isLoggedIn()) {
          show("LINEログインへ移動します...");

          liff.login({
            redirectUri: getRedirectUrl(src)
          });

          return;
        }

        show("プロフィール取得中...");

        let profile;

        try {
          profile = await liff.getProfile();
        } catch (err) {
          if (
            err.message &&
            err.message.includes("access token revoked")
          ) {
            retryLogin();
            return;
          }

          throw err;
        }

        show("流入元を保存中...");

        await saveToGas(src, profile);

        show("友だち追加画面へ移動します...");

        setTimeout(function() {
          location.href = FRIEND_ADD_URL;
        }, 1000);

      } catch (err) {
        show("エラー: " + err.message);
        console.error(err);
      }
    }

    main();
  </script>

</body>
</html>
